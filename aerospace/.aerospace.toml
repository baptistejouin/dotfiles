# Reference: https://github.com/i3/i3/blob/next/etc/config

config-version = 2

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
start-at-login = true

persistent-workspaces = [
  '1',
  '2',
  '3',
  '4',
  '5',
  '6',
  '7',
  '8',
  '9',
  'q',
  'w',
  'e',
  'r',
  't',
  'y',
]

# after-startup-command = [
#   'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0'
# ]

accordion-padding = 48

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = [{ monitor.secondary = 128 }, 0]
outer.bottom = [{ monitor.secondary = 32 }, 0]
outer.top = [{ monitor.secondary = 32 }, 0]
outer.right = [{ monitor.secondary = 448 }, 0]

[workspace-to-monitor-force-assignment]
1 = 'secondary'
2 = 'secondary'
3 = 'secondary'
4 = 'secondary'
5 = 'secondary'
6 = 'secondary'
7 = 'secondary'
8 = 'secondary'
9 = 'secondary'
q = 'main'
w = 'main'
e = 'main'
r = 'main'
t = 'main'
y = 'main'

[mode.main.binding]
alt-shift-semicolon = 'mode layout'

alt-h = 'focus left --ignore-floating'
alt-j = 'focus down --ignore-floating'
alt-k = 'focus up --ignore-floating'
alt-l = 'focus right --ignore-floating'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
alt-tab = 'workspace-back-and-forth'
# alt-shift-space = 'layout floating tiling' # 'floating toggle' in i3

# Not supported, because this command is redundant in AeroSpace mental model.
# See: https://nikitabobko.github.io/AeroSpace/guide#floating-windows
#alt-space = 'focus toggle_tiling_floating'

# `focus parent`/`focus child` are not yet supported, and it's not clear whether they
# should be supported at all https://github.com/nikitabobko/AeroSpace/issues/5
# alt-a = 'focus parent'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-q = 'workspace q'
alt-w = 'workspace w'
alt-e = 'workspace e'
alt-r = 'workspace r'
alt-t = 'workspace t'
alt-y = 'workspace y'

alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'
alt-shift-q = 'move-node-to-workspace q --focus-follows-window'
alt-shift-w = 'move-node-to-workspace w --focus-follows-window'
alt-shift-e = 'move-node-to-workspace e --focus-follows-window'
alt-shift-r = 'move-node-to-workspace r --focus-follows-window'
alt-shift-t = 'move-node-to-workspace t --focus-follows-window'
alt-shift-y = 'move-node-to-workspace y --focus-follows-window'

ctrl-shift-1 = 'exec-and-forget ~/.config/aerospace/move-focused-app-to-workspace.sh 1'
ctrl-shift-2 = 'exec-and-forget ~/.config/aerospace/move-focused-app-to-workspace.sh 2'
ctrl-shift-3 = 'exec-and-forget ~/.config/aerospace/move-focused-app-to-workspace.sh 3'
ctrl-shift-4 = 'exec-and-forget ~/.config/aerospace/move-focused-app-to-workspace.sh 4'
ctrl-shift-5 = 'exec-and-forget ~/.config/aerospace/move-focused-app-to-workspace.sh 5'
ctrl-shift-6 = 'exec-and-forget ~/.config/aerospace/move-focused-app-to-workspace.sh 6'
ctrl-shift-7 = 'exec-and-forget ~/.config/aerospace/move-focused-app-to-workspace.sh 7'
ctrl-shift-8 = 'exec-and-forget ~/.config/aerospace/move-focused-app-to-workspace.sh 8'
ctrl-shift-9 = 'exec-and-forget ~/.config/aerospace/move-focused-app-to-workspace.sh 9'
ctrl-shift-q = 'exec-and-forget ~/.config/aerospace/move-focused-app-to-workspace.sh q'
ctrl-shift-w = 'exec-and-forget ~/.config/aerospace/move-focused-app-to-workspace.sh w'
ctrl-shift-e = 'exec-and-forget ~/.config/aerospace/move-focused-app-to-workspace.sh e'
ctrl-shift-r = 'exec-and-forget ~/.config/aerospace/move-focused-app-to-workspace.sh r'
ctrl-shift-t = 'exec-and-forget ~/.config/aerospace/move-focused-app-to-workspace.sh t'
ctrl-shift-y = 'exec-and-forget ~/.config/aerospace/move-focused-app-to-workspace.sh y'

[mode.layout.binding]
esc = ['mode main']

r = ['flatten-workspace-tree', 'mode main']               # reset layout
f = ['layout floating tiling', 'mode main']               # floating layout
a = ['layout accordion horizontal vertical', 'mode main'] # accordion layout
v = ['layout tiles horizontal vertical', 'mode main']     # split layout
j = ['join-with left']

# [[on-window-detected]]
# if.app-id = 'com.apple.finder'
# run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace r --focus-follows-window'

[[on-window-detected]]
if.app-id = 'net.imput.helium'
if.window-title-regex-substring = '.*DevTools.*'
run = ['layout floating', 'move-node-to-workspace 1 --focus-follows-window']

[[on-window-detected]]
if.app-id = 'net.imput.helium'
if.window-title-regex-substring = '^(?!.*DevTools).*'
run = ['move-node-to-workspace 2 --focus-follows-window']

[[on-window-detected]]
if.app-id = 'com.DanPristupov.Fork'
run = ['layout floating', 'move-node-to-workspace e --focus-follows-window']
check-further-callbacks = true                                               # fork use the native tab support of apple and they are not support as i expect (see the open issue)

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace q --focus-follows-window']
check-further-callbacks = true                            # huddle window are by default flow (i dont want this)

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace w --focus-follows-window']

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = ['move-node-to-workspace 9 --focus-follows-window']

[[on-window-detected]]
if.app-id = 'com.usebruno.app'
run = ['move-node-to-workspace 3 --focus-follows-window']
